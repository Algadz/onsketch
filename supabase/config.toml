# Settings for `supabase functions deploy` (Supabase CLI). When deploying
# from the dashboard instead, set the same "Verify JWT" switch there.
[functions.stripe-webhook]
verify_jwt = false   # Stripe signs its requests (Stripe-Signature) instead

[functions.billing]
verify_jwt = true    # called by signed-in users only

[functions.mcp]
verify_jwt = false   # answers 401 + WWW-Authenticate itself, which starts OAuth sign-in in MCP clients
