<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>OnSketch</title>
<script defer src="https://cloud.umami.is/script.js" data-website-id="50dad292-9502-4749-a86e-68f2ed8b2e7a"></script>
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div id="app">

  <!-- ============================================================
       TOP BAR
       ============================================================ -->
  <header id="topbar">
    <div class="group">
      <span class="label">File</span>
      <button class="tbtn" data-action="new" title="New project" aria-label="New project">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v5h4"/><path d="M9 14h6M12 11v6"/></svg>
      </button>
      <button class="tbtn" data-action="save" title="Save to browser" aria-label="Save to browser">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h12l2 2v14H5z"/><path d="M8 4v6h8V4"/><path d="M8 20v-6h8v6"/></svg>
      </button>
      <button class="tbtn" data-action="export" title="Export JSON" aria-label="Export JSON">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4"/><path d="M8 8l4-4 4 4"/><path d="M5 14v5h14v-5"/></svg>
      </button>
      <button class="tbtn" data-action="import" title="Import JSON" aria-label="Import JSON">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="M8 11l4 4 4-4"/><path d="M5 14v5h14v-5"/></svg>
      </button>
    </div>

    <div class="group">
      <span class="label">Edit</span>
      <button class="tbtn" data-action="undo" title="Undo (Ctrl+Z)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-15-6.7L3 13"/></svg>
      </button>
      <button class="tbtn" data-action="redo" title="Redo (Ctrl+Y)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 15-6.7L21 13"/></svg>
      </button>
    </div>

    <div class="group">
      <span class="label">Draw</span>
      <button class="tbtn tool" data-tool="select" title="Select (S)">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 3l13 8-5 1 3 7-2 1-3-7-4 4z"/></svg>
      </button>
      <button class="tbtn tool" data-tool="line" title="Line (L)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="4" y1="20" x2="20" y2="4"/><circle cx="4" cy="20" r="1.6" fill="currentColor"/><circle cx="20" cy="4" r="1.6" fill="currentColor"/></svg>
      </button>
      <button class="tbtn tool" data-tool="centerLine" title="Centerpoint Line (Shift+L)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="4" y1="12" x2="20" y2="12"/><circle cx="4" cy="12" r="1.5" fill="currentColor"/><circle cx="20" cy="12" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg>
      </button>
      <button class="tbtn tool" data-tool="rectangle" title="Rectangle (R)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="6" width="16" height="12"/></svg>
      </button>
      <button class="tbtn tool" data-tool="centerRectangle" title="Center Rectangle (Shift+R)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="6" width="16" height="12"/><path d="M4 12h16M12 6v12" stroke-dasharray="3 3"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/></svg>
      </button>
      <button class="tbtn tool" data-tool="circle" title="Circle (C)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg>
      </button>
      <button class="tbtn tool" data-tool="threePointCircle" title="3-Point Circle (Shift+C)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="4" r="1.4" fill="currentColor"/><circle cx="19" cy="15" r="1.4" fill="currentColor"/><circle cx="5" cy="15" r="1.4" fill="currentColor"/></svg>
      </button>
      <button class="tbtn tool" data-tool="hexagon" title="Hexagon / Polygon (H)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3.5l7.4 4.25v8.5L12 20.5l-7.4-4.25v-8.5z"/><circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none"/></svg>
      </button>
      <button class="tbtn tool" data-tool="arc" title="Centerpoint Arc (A)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 0 0-8-8"/><path d="M12 12h8M12 12V4" stroke-dasharray="3 3"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="20" cy="12" r="1.4" fill="currentColor"/><circle cx="12" cy="4" r="1.4" fill="currentColor"/></svg>
      </button>
      <button class="tbtn tool" data-tool="point" title="Point (P)">
        <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="3"/></svg>
      </button>
      <button class="tbtn tool" data-tool="smartdim" title="Smart Dimension (D)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 8h4M3 16h4M21 8h-4M21 16h-4M5 8v8M19 8v8"/><text x="9" y="14" fill="currentColor" stroke="none" font-size="8" font-weight="700">12</text></svg>
      </button>
    </div>

    <div class="group">
      <span class="label">Modes</span>
      <button class="tbtn toggle" data-action="construction" title="Construction geometry">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 17h16" stroke-dasharray="3 3"/><path d="M6 7h12"/></svg><span class="btn-label">Constr</span>
      </button>
      <button class="tbtn toggle on" data-action="grid" title="Show grid">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 4h16v16H4z"/><path d="M4 10h16M4 16h16M10 4v16M16 4v16"/></svg><span class="btn-label">Grid</span>
      </button>
      <button class="tbtn toggle on" data-action="snap" title="Snap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v4M12 16v4M4 12h4M16 12h4"/><circle cx="12" cy="12" r="3"/></svg><span class="btn-label">Snap</span>
      </button>
    </div>

    <div class="group">
      <span class="label">Modify</span>
      <button class="tbtn" data-action="mirror" title="Mirror selected entities about selected line">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v16"/><path d="M5 7l5 5-5 5z"/><path d="M19 7l-5 5 5 5z"/></svg><span class="btn-label">Mirror</span>
      </button>
      <button class="tbtn" data-action="offset" title="Offset selected line, circle, or arc">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17c4-8 10-8 14 0"/><path d="M7 12c3-5 7-5 10 0"/><path d="M5 17h14"/></svg><span class="btn-label">Offset</span>
      </button>
      <button class="tbtn" data-action="solve" title="Solve now (F5)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg><span class="btn-label">Solve</span>
      </button>
    </div>

    <div class="group">
      <span class="label">View</span>
      <button class="tbtn" data-action="zoom-fit" title="Zoom to fit (F)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4H4v4M16 4h4v4M8 20H4v-4M16 20h4v-4"/><path d="M9 9h6v6H9z"/></svg><span class="btn-label">Fit</span>
      </button>
      <button class="tbtn" data-action="zoom-reset" title="Reset view">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6"/><path d="M16 16l4 4"/><path d="M11 8v6"/></svg><span class="btn-label">1:1</span>
      </button>
      <button class="tbtn toggle" data-action="color-mode" title="Colour geometry by constraint status or by layer / entity colour">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.6-.9 1.2-1.8-.5-1-.1-2.2 1.1-2.2H17a4 4 0 0 0 4-4c0-5-4-10-9-10z"/><circle cx="7.5" cy="11" r="1.2" fill="currentColor"/><circle cx="10.5" cy="7" r="1.2" fill="currentColor"/><circle cx="15" cy="7.5" r="1.2" fill="currentColor"/></svg><span class="btn-label" id="color-mode-label">Status</span>
      </button>
      <button class="tbtn" data-action="theme" title="Toggle light / dark theme" aria-label="Toggle light / dark theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      </button>
    </div>
  </header>

  <!-- ============================================================
       LEFT SIDEBAR
       ============================================================ -->
  <aside id="sidebar">

    <!-- Sketches / Layers -->
    <div class="sb-section sb-layers">
      <div class="panel-header">
        <span>Sketches</span>
        <div class="actions">
          <button class="icon-btn" id="add-layer" title="Add sketch" aria-label="Add sketch">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
      </div>
      <div id="layers-list"></div>
    </div>

    <!-- Tool options -->
    <div class="sb-section sb-tool-options" id="tool-options-section" hidden>
      <div class="panel-header">
        <span id="tool-options-title">Tool Options</span>
      </div>
      <div class="sb-body" id="tool-options-body"></div>
    </div>

    <!-- Selection / Relations / Properties -->
    <div class="sb-section sb-selection">
      <div class="panel-header">
        <span>Selection</span>
        <span class="badge" id="sel-count">0 items</span>
      </div>
      <div class="sb-body" id="sel-body">
        <div class="empty">Click an entity to select. Ctrl-click to add or remove from selection.</div>
      </div>
    </div>

    <!-- Project meta -->
    <div class="sb-section sb-meta">
      <div id="project-meta">
        <div>Project name</div>
        <input type="text" id="project-name" value="Untitled" />
        <div style="margin-top:6px;font-size:10px;color:var(--text-muted)">
          Units: <span id="units">mm</span>
        </div>
      </div>
    </div>
  </aside>

  <!-- ============================================================
       RIGHT SIDEBAR: layers + style
       ============================================================ -->
  <aside id="rightbar">
    <div class="sb-section sb-layerlist">
      <div class="panel-header">
        <span>Layers</span>
        <div class="actions">
          <button class="icon-btn" id="layer-add" title="New layer above the active one" aria-label="New layer"></button>
          <button class="icon-btn" id="layer-up" title="Move layer up" aria-label="Move layer up"></button>
          <button class="icon-btn" id="layer-down" title="Move layer down" aria-label="Move layer down"></button>
          <button class="icon-btn" id="layer-delete" title="Delete layer and its geometry" aria-label="Delete layer"></button>
        </div>
      </div>
      <div id="layer-list"></div>
    </div>
    <div class="sb-section sb-style">
      <div class="panel-header">
        <span id="style-title">Style</span>
        <span class="badge" id="style-target">Layer</span>
      </div>
      <div class="sb-body" id="style-body"></div>
    </div>
  </aside>

  <!-- ============================================================
       WORKSPACE
       ============================================================ -->
  <main id="workspace">
    <canvas id="canvas"></canvas>
    <div id="cursor-hint"></div>
  </main>

  <!-- ============================================================
       STATUS BAR
       ============================================================ -->
  <footer id="statusbar">
    <span id="status-tool">Tool: Select</span>
    <span id="status-coords">x: 0.000  y: 0.000</span>
    <span id="status-zoom">Zoom: 100%</span>
    <span id="status-layer">Layer: —</span>
    <span class="spacer"></span>
    <span class="pill" id="status-state">—</span>
    <span class="pill" id="status-dof">DOF: 0</span>
    <span class="pill" id="status-solve">solver idle</span>
    <span id="status-hint"></span>
  </footer>
</div>

<!-- Import / Export modal -->
<div class="modal-backdrop" id="json-modal">
  <div class="modal">
    <h3 id="json-modal-title">Export JSON</h3>
    <div class="body">
      <textarea id="json-modal-text"></textarea>
    </div>
    <div class="footer">
      <button class="btn"          id="json-modal-cancel">Cancel</button>
      <button class="btn primary"  id="json-modal-ok">OK</button>
    </div>
  </div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
