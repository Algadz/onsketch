<body>

<div id="app">

  <!-- ============================================================
       MENU BAR: file / edit on the left, view + windows on the right
       ============================================================ -->
  <header id="menubar">
    <div class="brand" title="OnSketch">On<b>Sketch</b></div>
    <div class="group" aria-label="File">
      <button class="tbtn" data-action="new" title="New project"></button>
      <button class="tbtn" data-action="import" title="Open (import JSON)"></button>
      <button class="tbtn" data-action="save" title="Save to browser"></button>
      <button class="tbtn" data-action="export" title="Export JSON"></button>
    </div>
    <div class="group" aria-label="Edit">
      <button class="tbtn" data-action="undo" title="Undo (Ctrl+Z)"></button>
      <button class="tbtn" data-action="redo" title="Redo (Ctrl+Y)"></button>
      <button class="tbtn" data-action="solve" title="Re-solve constraints (F5)"></button>
    </div>
    <input type="text" id="project-name" value="Untitled" title="Project name" aria-label="Project name" />
    <span class="units" title="Units">mm</span>
    <span class="spacer"></span>
    <div class="group" aria-label="View">
      <button class="tbtn toggle on" data-action="grid" title="Show grid"></button>
      <button class="tbtn toggle on" data-action="snap" title="Snap to geometry"></button>
      <button class="tbtn toggle on" data-action="dimensions" title="Show / hide dimensions (M)"></button>
      <button class="tbtn" data-action="zoom-fit" title="Zoom to fit (F)"></button>
      <button class="tbtn" data-action="zoom-reset" title="Reset zoom"></button>
      <button class="tbtn" data-action="theme" title="Light / dark theme"></button>
    </div>
    <div class="group" aria-label="Windows">
      <button class="tbtn toggle" data-window="tools" title="Tools window"></button>
      <button class="tbtn toggle" data-window="colors" title="Colors window"></button>
      <button class="tbtn toggle" data-window="layers" title="Layers window"></button>
      <button class="tbtn toggle" data-window="props" title="Properties window (selection, relations, dimensions)"></button>
      <button class="tbtn toggle" data-window="equations" title="Equations: global variables and dimension formulas"></button>
      <button class="tbtn" data-action="reset-layout" title="Reset window layout"></button>
    </div>
  </header>

  <!-- Tool options bar: changes with the active tool (like Paint.NET) -->
  <div id="optbar" role="toolbar" aria-label="Tool options"></div>

  <!-- ============================================================
       WORKSPACE with floating windows
       ============================================================ -->
  <main id="workspace">
    <canvas id="canvas"></canvas>
    <div id="cursor-hint"></div>
    <div id="lock-banner" hidden></div>

    <section class="fwin" data-win="tools" aria-label="Tools">
      <header class="fwin-head"><span>Tools</span><button class="fwin-x" title="Close" aria-label="Close">&times;</button></header>
      <div class="fwin-body" id="tools-body"></div>
    </section>

    <section class="fwin" data-win="colors" aria-label="Colors">
      <header class="fwin-head"><span>Colors</span><button class="fwin-x" title="Close" aria-label="Close">&times;</button></header>
      <div class="fwin-body" id="colors-body"></div>
    </section>

    <section class="fwin" data-win="layers" aria-label="Layers">
      <header class="fwin-head"><span>Layers</span>
        <span class="fwin-actions">
          <button class="icon-btn" id="layer-add" title="New layer above the active one" aria-label="New layer"></button>
          <button class="icon-btn" id="layer-up" title="Move layer up" aria-label="Move layer up"></button>
          <button class="icon-btn" id="layer-down" title="Move layer down" aria-label="Move layer down"></button>
          <button class="icon-btn" id="layer-delete" title="Delete layer and its geometry" aria-label="Delete layer"></button>
        </span>
        <button class="fwin-x" title="Close" aria-label="Close">&times;</button></header>
      <div class="fwin-body">
        <div id="layer-list"></div>
        <div id="layer-props"></div>
      </div>
    </section>

    <section class="fwin fwin-tall" data-win="props" aria-label="Properties">
      <header class="fwin-head"><span>Properties</span><span class="badge" id="sel-count">0 items</span><button class="fwin-x" title="Close" aria-label="Close">&times;</button></header>
      <div class="fwin-body fwin-scroll">
        <div class="sb-tool-options" id="tool-options-section" hidden>
          <div class="sb-subhead" id="tool-options-title">Tool Options</div>
          <div id="tool-options-body"></div>
        </div>
        <div id="sel-body">
          <div class="empty">Click an entity to select. Ctrl-click to add or remove from selection.</div>
        </div>
      </div>
    </section>
    <section class="fwin" data-win="equations" data-closed aria-label="Equations">
      <header class="fwin-head"><span>Equations</span><button class="fwin-x" title="Close" aria-label="Close">&times;</button></header>
      <div class="fwin-body fwin-scroll" id="equations-body"></div>
    </section>
  </main>

  <!-- ============================================================
       STATUS BAR
       ============================================================ -->
  <footer id="statusbar">
    <span id="status-tool">Tool: Select</span>
    <span id="status-coords">x: 0.000  y: 0.000</span>
    <span id="status-zoom">Zoom: 100%</span>
    <span id="status-layer">Layer: —</span>
    <span class="spacer"></span>
    <span class="pill" id="status-state">—</span>
    <span class="pill" id="status-dof">DOF: 0</span>
    <span class="pill" id="status-solve">solver idle</span>
    <span id="status-hint"></span>
  </footer>
</div>

<!-- Import / Export modal -->
<div class="modal-backdrop" id="json-modal">
  <div class="modal">
    <h3 id="json-modal-title">Export JSON</h3>
    <div class="body">
      <textarea id="json-modal-text"></textarea>
    </div>
    <div class="footer">
      <button class="btn"          id="json-modal-cancel">Cancel</button>
      <button class="btn primary"  id="json-modal-ok">OK</button>
    </div>
  </div>
</div>

<script type="module" src="src/main.js?v=2453a94fe6"></script>
</body>
</html>
