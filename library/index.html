<header class="page-bar">

<main class="page-main">
  <section class="lib-intro">
    <div>
      <h2>Sketches drawn to scale</h2>
      <p>Free sketches shared by OnSketch users. Open any of them as a copy in the editor, change it, make it yours.</p>
    </div>
    <form class="lib-search" id="lib-search" role="search">
      <input type="search" name="q" placeholder="Search: desk, shelf, garden…" aria-label="Search the library" maxlength="60" />

        <option value="new">Newest</option>
        <option value="updated">Recently updated</option>
        <option value="popular">Most liked</option>
      </select>
    </form>
  </section>
  <p class="page-msg" id="page-msg" role="status">Loading…</p>
  <ul class="sketches" id="grid" aria-label="Public sketches"></ul>
  <div class="lib-more"><button type="button" class="btn" id="lib-more" hidden>Show more</button></div>
</main>
